name: Django CI/CD

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "DEBUG=${{ secrets.DEBUG }}" >> .env

          echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
          echo "POSTGRES_USER=${{ secrets.DB_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "POSTGRES_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.DB_PORT }}" >> .env

          # echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
          # echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
          # echo "EMAIL_USE_SSL=${{ secrets.EMAIL_USE_SSL }}" >> .env
          # echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> .env
          # echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          # echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env

          # echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
          # echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env

          # echo "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" >> .env

  deploy:
    runs-on: ubuntu-latest
    needs: build

